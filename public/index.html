<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OP极速登录器</title>
    <style>
        :root {
            --bg-top: #f4f6fb;
            --bg-bottom: #eef2f8;
            --surface: rgba(255, 255, 255, 0.94);
            --surface-strong: #ffffff;
            --surface-soft: #f7f9fe;
            --line: rgba(22, 41, 93, 0.08);
            --line-strong: rgba(27, 68, 178, 0.14);
            --text-main: #132044;
            --text-secondary: #5f6f93;
            --text-muted: #8d99b5;
            --brand: #1767ff;
            --brand-strong: #0e56ea;
            --brand-deep: #102a78;
            --success: #56d287;
            --shadow-large: 0 28px 80px rgba(41, 72, 148, 0.14);
            --shadow-card: 0 18px 40px rgba(39, 64, 129, 0.1);
            --shadow-button: 0 16px 28px rgba(23, 103, 255, 0.28);
            --radius-shell: 34px;
            --radius-card: 22px;
            --radius-input: 18px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(circle at top center, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0) 34%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: auto;
            border-radius: 999px;
            pointer-events: none;
            filter: blur(24px);
            opacity: 0.42;
            z-index: 0;
        }

        body::before {
            width: 220px;
            height: 220px;
            top: 96px;
            left: calc(50% - 250px);
            background: rgba(90, 162, 255, 0.25);
        }

        body::after {
            width: 260px;
            height: 260px;
            right: calc(50% - 320px);
            bottom: 120px;
            background: rgba(37, 101, 255, 0.12);
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
        }

        .shell {
            width: min(100%, 390px);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(247, 249, 255, 0.96) 100%);
            border: 1px solid rgba(255, 255, 255, 0.92);
            border-radius: var(--radius-shell);
            box-shadow: var(--shadow-large);
            padding: 28px 18px 22px;
            position: relative;
            overflow: hidden;
        }

        .shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0)),
                radial-gradient(circle at top center, rgba(93, 144, 255, 0.12), transparent 34%);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            padding: 18px 6px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .brand-copy {
            min-width: 0;
        }

        .brand-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: var(--text-main);
        }

        .brand-subtitle {
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        .logo {
            width: 44px;
            height: 52px;
            flex: 0 0 auto;
            filter: drop-shadow(0 10px 18px rgba(22, 103, 255, 0.16));
        }

        .notice-card,
        .field-card,
        .helper-link {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .notice-card {
            display: grid;
            grid-template-columns: 40px 1fr;
            gap: 12px;
            align-items: center;
            padding: 16px 14px;
            border-radius: var(--radius-card);
            background: rgba(255, 255, 255, 0.76);
            border: 1px solid rgba(255, 255, 255, 0.88);
            box-shadow: var(--shadow-card);
            margin-bottom: 18px;
        }

        .notice-icon {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            color: var(--brand);
            background: linear-gradient(180deg, rgba(23, 103, 255, 0.12) 0%, rgba(23, 103, 255, 0.04) 100%);
            border: 1px solid rgba(23, 103, 255, 0.08);
            font-size: 18px;
        }

        .notice-text {
            margin: 0;
            font-size: 13px;
            line-height: 1.65;
            color: #253355;
            font-weight: 500;
        }

        .section-label {
            margin: 0 0 10px;
            font-size: 13px;
            font-weight: 700;
            color: #2a385a;
        }

        .field-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(248, 250, 255, 0.88) 100%);
            border: 1px solid var(--line);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        .field-card + .field-card {
            margin-top: 12px;
        }

        .field-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 16px 0;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .field-icon {
            width: 16px;
            height: 16px;
            color: #8f9bbc;
            flex: 0 0 auto;
        }

        textarea,
        select {
            width: 100%;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--text-main);
            font: inherit;
        }

        textarea {
            min-height: 156px;
            resize: vertical;
            padding: 10px 16px 16px;
            font-size: 14px;
            line-height: 1.7;
        }

        textarea::placeholder,
        select {
            color: #9ca8c3;
        }

        .select-wrap {
            position: relative;
            padding: 0 16px 14px;
        }

        select {
            appearance: none;
            padding: 10px 40px 2px 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .select-wrap::after {
            content: "";
            position: absolute;
            right: 18px;
            top: 17px;
            width: 9px;
            height: 9px;
            border-right: 2px solid #8f9bbc;
            border-bottom: 2px solid #8f9bbc;
            transform: rotate(45deg);
            pointer-events: none;
        }

        .security-tip {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 14px 2px 24px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .security-tip svg {
            width: 14px;
            height: 14px;
            color: var(--brand);
            flex: 0 0 auto;
        }

        .submit-button {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 16px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.01em;
            background: linear-gradient(90deg, var(--brand) 0%, #1c72ff 60%, var(--brand-strong) 100%);
            box-shadow: var(--shadow-button);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .submit-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 20px 32px rgba(23, 103, 255, 0.32);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .submit-button:disabled {
            cursor: not-allowed;
            opacity: 0.8;
            box-shadow: 0 10px 20px rgba(23, 103, 255, 0.18);
        }

        .submit-button svg {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
        }

        .helper-link {
            margin-top: 16px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .helper-link a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }

        .home-indicator {
            width: 134px;
            height: 5px;
            margin: 22px auto 0;
            border-radius: 999px;
            background: rgba(9, 18, 37, 0.9);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%) translateY(20px);
            min-width: 220px;
            max-width: min(calc(100vw - 32px), 360px);
            padding: 13px 16px;
            border-radius: 16px;
            background: rgba(18, 31, 67, 0.92);
            color: #ffffff;
            font-size: 13px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(9, 17, 39, 0.24);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.24s ease, transform 0.24s ease;
            z-index: 30;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background: rgba(146, 31, 42, 0.94);
        }

        .dialog-mask {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(168, 177, 197, 0.42);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 25;
        }

        .dialog-mask.show {
            opacity: 1;
            pointer-events: auto;
        }

        .dialog {
            width: min(100%, 280px);
            padding: 24px 22px 18px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 28px 68px rgba(45, 66, 124, 0.22);
            text-align: center;
        }

        .dialog-spinner,
        .dialog-success {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: grid;
            place-items: center;
        }

        .dialog-spinner {
            border: 5px solid rgba(23, 103, 255, 0.16);
            border-top-color: rgba(23, 103, 255, 0.9);
            animation: spin 1s linear infinite;
        }

        .dialog-success {
            background: rgba(86, 210, 135, 0.18);
            color: #1fa155;
        }

        .dialog-success svg {
            width: 28px;
            height: 28px;
        }

        .dialog-title {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .dialog-body {
            margin: 8px 0 0;
            font-size: 12px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .dialog-token {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            background: var(--surface-soft);
            border: 1px solid rgba(16, 42, 120, 0.08);
            font-size: 11px;
            color: var(--text-secondary);
            word-break: break-all;
        }

        .dialog-button {
            margin-top: 14px;
            width: 100%;
            height: 42px;
            border: 0;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(90deg, var(--brand) 0%, var(--brand-strong) 100%);
        }

        .hidden {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 420px) {
            .page {
                padding: 0;
            }

            .shell {
                width: 100%;
                min-height: 100vh;
                border-radius: 0;
                padding-top: 20px;
            }
        }
    </style>
</head>

    <script>
        const wakeUrlCache = window.createWakeUrlCache();
        let pendingWakeUrl = '';
        let confirmTimer = null;
        let redirectTimer = null;
        let prefetchTimer = null;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;

            window.clearTimeout(showToast.timer);
            showToast.timer = window.setTimeout(() => {
                toast.classList.remove('show');
            }, 2600);
        }

        function maskToken(opValue) {
            const parts = String(opValue || '').split('|');
            const token = (parts[1] || parts[0] || '').trim();
            if (!token) {
                return 'Token: 未读取到';
            }

            if (token.length <= 28) {
                return `Token: ${token}`;
            }

            return `Token: ${token.slice(0, 24)}...`;
        }

        function setStatusText(opValue) {
            const statusText = document.getElementById('statusText');
            statusText.innerHTML = opValue
                ? '已识别到 OP 数据，<br>确认应用后可直接授权登录'
                : '请在游戏中点击QQ登录，<br>等待跳转到此页面';
        }

        function showProcessingDialog() {
            const dialogMask = document.getElementById('dialogMask');
            document.getElementById('dialogProcessing').classList.remove('hidden');
            document.getElementById('dialogSuccess').classList.add('hidden');
            dialogMask.classList.add('show');
            dialogMask.setAttribute('aria-hidden', 'false');
        }

        function showSuccessDialog(opValue) {
            const dialogMask = document.getElementById('dialogMask');
            document.getElementById('dialogProcessing').classList.add('hidden');
            document.getElementById('dialogSuccess').classList.remove('hidden');
            document.getElementById('dialogToken').textContent = maskToken(opValue);
            dialogMask.classList.add('show');
            dialogMask.setAttribute('aria-hidden', 'false');
        }

        function hideDialog() {
            const dialogMask = document.getElementById('dialogMask');
            dialogMask.classList.remove('show');
            dialogMask.setAttribute('aria-hidden', 'true');
            window.clearTimeout(confirmTimer);
            window.clearTimeout(redirectTimer);
        }

        function launchPendingWakeUrl() {
            if (!pendingWakeUrl) {
                hideDialog();
                return;
            }

            const wakeUrl = pendingWakeUrl;
            pendingWakeUrl = '';
            hideDialog();
            window.location.href = wakeUrl;
        }

        async function prefetchWakeUrlForForm() {
            const urlInput = document.getElementById('url').value.trim();
            const gameInput = document.getElementById('game').value;
            if (!urlInput || !gameInput || !window.shouldPrefetchWakeUrl(urlInput)) {
                return '';
            }

            try {
                return await wakeUrlCache.prefetch(urlInput, gameInput);
            } catch (error) {
                return '';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlElement = document.getElementById('url');
            const gameElement = document.getElementById('game');
            const initialValue = window.extractInitialOpValueFromLocation(window.location);

            if (initialValue) {
                urlElement.value = initialValue;
            }

            setStatusText(urlElement.value.trim());

            const schedulePrefetch = () => {
                window.clearTimeout(prefetchTimer);
                prefetchTimer = window.setTimeout(() => {
                    void prefetchWakeUrlForForm();
                }, 180);
            };

            urlElement.addEventListener('input', () => {
                setStatusText(urlElement.value.trim());
                schedulePrefetch();
            });
            urlElement.addEventListener('change', () => {
                setStatusText(urlElement.value.trim());
                void prefetchWakeUrlForForm();
            });
            gameElement.addEventListener('change', () => {
                void prefetchWakeUrlForForm();
            });
            document.getElementById('dialogConfirmBtn').addEventListener('click', launchPendingWakeUrl);

            void prefetchWakeUrlForForm();
        });

        async function submitData() {
            const urlInput = document.getElementById('url').value.trim();
            const gameInput = document.getElementById('game').value;
            const btn = document.getElementById('submitBtn');

            if (!urlInput) {
                showToast('请输入数据号 URL', 'error');
                return;
            }

            const label = btn.querySelector('span');
            const originalText = label.textContent;
            btn.disabled = true;
            label.textContent = '正在处理中...';
            showProcessingDialog();

            try {
                const wakeUrl =
                    wakeUrlCache.get(urlInput, gameInput) ||
                    await wakeUrlCache.prefetch(urlInput, gameInput);
                pendingWakeUrl = wakeUrl;
                showSuccessDialog(urlInput);
                confirmTimer = window.setTimeout(launchPendingWakeUrl, 850);
                redirectTimer = window.setTimeout(() => {
                    btn.disabled = false;
                    label.textContent = originalText;
                }, 1200);
            } catch (error) {
                console.error('Error:', error);
                hideDialog();
                btn.disabled = false;
                label.textContent = originalText;
                showToast(error.message || '上号失败，请检查网络或数据号', 'error');
            }
        }
    </script>
</body>
</html>
